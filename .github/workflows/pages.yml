name: Deploy site
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The blog moved to shissorobotics.com (MOVED.md): publish the redirect tree, not the MkDocs build.
      - run: pip install ghp-import
      - run: ghp-import --no-jekyll --push --force --branch gh-pages redirects
